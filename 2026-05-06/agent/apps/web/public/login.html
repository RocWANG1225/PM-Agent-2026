<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - 项目管理 Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel">
        <div class="brand login-brand">
          <span class="mark">PM</span>
          <div>
            <strong>项目管理 Agent</strong>
            <small>本地化访问</small>
          </div>
        </div>
        <form id="loginForm" class="login-form">
          <label>
            账号
            <input name="username" autocomplete="username" value="wangpeng5" />
          </label>
          <label>
            密码
            <input name="password" type="password" autocomplete="current-password" />
          </label>
          <button type="submit">登录</button>
          <button type="button" class="secondary-button full-width" id="touchLoginButton">使用 Touch ID 登录</button>
          <button type="button" class="secondary-button full-width" id="touchRegisterButton">绑定 Touch ID</button>
        </form>
        <p id="loginMessage" class="login-message">已绑定 Touch ID 时会自动唤起验证；首次使用请先输入账号密码并绑定。</p>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
