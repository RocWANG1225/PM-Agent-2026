name: sprint-migration-analysis
description: 分析 ONES 工作项是否应从当前迭代移动到目标迭代。
required_inputs:
  - onesUrl
  - currentSprint
  - targetSprint
  - rule
  - itemsText
safety:
  - 默认只读分析
  - 不自动移动工作项
  - 已实现和实现中是否排除必须由筛选规则显式说明
  - 真正执行移动前必须二次确认
outputs:
  - suggested migration list
  - excluded list
  - saved run record
