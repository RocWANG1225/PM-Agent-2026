name: weekly-report
description: 从用户选择的本地 PPT/PDF 中按可编辑固定运行规则提取当周页面，生成老板版项目周报。
required_inputs:
  - sourceFile
  - startDate
  - endDate
  - weeklyRules
default_rules:
  - 只筛选文本中包含“议题”的页面
  - 页面中出现的开始日期等于系统当前日期的上一个周五
  - 页面中出现的截止日期等于系统当前日期的本周四
  - 开始日期和截止日期保持可手动选择状态
  - 修改固定运行规则后必须点击保存，生成周报只按已保存规则执行
  - 生成老板版周报草稿，并输出 Word 文件
safety:
  - 只读取本地文件
  - 不写入第三方系统
outputs:
  - markdown report
  - source slide references
