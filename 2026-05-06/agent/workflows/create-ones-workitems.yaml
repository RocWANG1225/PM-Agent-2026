name: create-ones-workitems
description: 从需求表生成 ONES 需求工作项批量导入清单。
required_inputs:
  - spreadsheetPath
  - targetIteration
fixed_source_rules:
  allowed_directory: /Users/wangpeng5/Downloads/Codex Materials/
  source_sheet: 需求汇总
  compare_sheet: v0.2
candidate_rules:
  - 必须包含具体需求内容和优先级
  - 需求分类为空时向上取最近非空值
  - 需求分类多行时只取第一行
exclusion_rules:
  - 排除状态=已实现
  - 排除 v0.2 已存在需求
  - 排除目标 ONES 迭代已存在相同具体需求内容的需求
import_fields:
  issue_type: 需求
  assignee: wangpeng5@tetras.ai
  status: 未开始
  project: Tetrasphere产品开发
  priority_mapping: P0=最高, P1=较高, P2=普通, P3=较低
safety:
  - 导入前必须人工确认
  - 导入失败需读取失败工作簿批注
  - 导入后需验证目标迭代需求数量增量
